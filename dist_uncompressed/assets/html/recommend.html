<section class="section_1">
  <h2 class="section_1__h1">
    おすすめ商品
  </h2>
  <{if $recommend|@count > 0}>
    <ul class="list_1">
      <{section name=i loop=$recommend}>
        <li>
          <a href="<{$recommend[i].url}>">
            <figure>
              <img src="<{$recommend[i].image_L}>" alt="<{$recommend[i].name}>" loading="lazy">
              <{if $recommend[i].is_soldout}>
                <span class="icon_1">SOLD OUT</span>
              <{/if}>
            </figure>
            <div>
              <h3 class="name">
                <{$recommend[i].name}>
              </h3>
              <p class="price">
                <span>¥<{$recommend[i].price|number_format}></span>
                <span>(tax in)</span>
              </p>
            </div>
          </a>
        </li>
      <{/section}>
    </ul><!-- /.list_1 -->
  <{else}>
    <p>現在おすすめ商品は準備中です。</p>
  <{/if}>
</section>
